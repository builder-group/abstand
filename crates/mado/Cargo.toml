[package]
name = "mado"
version = "0.0.21"
description = "macOS active app and window monitoring with browser metadata"
authors = { workspace = true }
license = "MIT"
edition = { workspace = true }
repository = { workspace = true }
readme = "README.md"
homepage = "https://github.com/builder-group/abstand/tree/develop/crates/mado"
keywords = ["macos", "window", "monitoring", "browser", "accessibility"]
categories = ["api-bindings", "os::macos-apis"]

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "2.0.0-rc.25", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.9"

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.9", features = ["build"] }
