name: Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI
        uses: ./.github/actions/ci
        with:
          app-directory: apps/desktop
          build-script: ui:build

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: ci
    environment: release-signing
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build desktop app
        uses: ./.github/actions/build-tauri-macos
        with:
          app-directory: apps/desktop
          target: ${{ matrix.target }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: abstand-${{ matrix.artifact }}
          path: release-bundle/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
